name: Probe original image CDN
on:
  push:
    branches: [fix/original-hires-posters-20261103]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pillow
      - name: Check full-resolution upload retrieval
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, io, re
          from PIL import Image
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          url = "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F7ade2f59-f9f3-4db7-9d41-c5015ac50911/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAF9dPy7zpqn0Ezk5z_vd1ryS50fi95mFEYAv2p7p850T&exp=1793704565&osig=AAAAAAAAAAAAAAAAAAAAADDz7H01EUg5HVMvA3zLybawF-H6BCU_WeW6hqsv16qk&signer=media-rpc&token=AAIAAU0AJDdhZGUyZjU5LWY5ZjMtNGRiNy05ZDQxLWM1MDE1YWM1MDkxMQAAAAABoaEfmQgVYIlL5VHQ7skD4LJe0NUTwrd0wuJXSOL1H7j09yDZuA&x-canva-quality=thumbnail"
          p = urlsplit(url)
          q=dict(parse_qsl(p.query))
          paths = {}
          paths['as-signed'] = url
          paths['resize-same-signature'] = url.replace('/height:200/','/height:2048/').replace('/width:112?', '/width:1152?')
          paths['resize-no-csig'] = paths['resize-same-signature'].replace('csig='+q['csig']+'&','')
          paths['resize-only-token'] = urlunsplit((p.scheme,p.netloc,urlsplit(paths['resize-same-signature']).path,'token='+q['token']+'&exp='+q['exp'],''))
          paths['original-no-resize'] = urlunsplit((p.scheme,p.netloc,re.sub(r'/height:200/','/',p.path).replace('/width:112',''),p.query,''))
          for label, link in paths.items():
            try:
              with urllib.request.urlopen(urllib.request.Request(link,headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as r:
                raw=r.read()
                im=Image.open(io.BytesIO(raw))
                print(label,'OK',r.status,len(raw),im.size)
            except urllib.error.HTTPError as exc: print(label,'HTTP',exc.code,exc.read(250)[:100])
            except Exception as e: print(label,'ERROR',str(e)[:110])
          PY
