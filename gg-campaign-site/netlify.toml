[build]
  publish = "."
  functions = "gg-campaign-site/netlify/functions"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/.netlify/functions/board"
  [headers.values]
    Cache-Control = "no-store"
